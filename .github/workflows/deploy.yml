name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse data and build site
        run: python scripts/build.py
      - name: Stamp asset URLs with the commit so browsers fetch fresh CSS/JS
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s/(href|src)=\"([a-z]+\.(css|js))\"/\1=\"\2?v=$v\"/g" site/*.html
          grep -ho '\(href\|src\)="[a-z]*\.\(css\|js\)?v=[0-9a-f]*"' site/*.html | sort -u
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
